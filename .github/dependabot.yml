---

version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"
    assignees:
      - "Plaenkler"
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "dependencies"
